version: '3.8'

services:
  # 1. EL PROXY INVERSO (Apache)
  apache_proxy:
    image: httpd:2.4
    container_name: apache_proxy
    restart: always
    # Activamos los módulos necesarios para el proxy y SSL
    command: >
      sh -c "
      sed -i 's/#LoadModule proxy_module/LoadModule proxy_module/' conf/httpd.conf &&
      sed -i 's/#LoadModule proxy_http_module/LoadModule proxy_http_module/' conf/httpd.conf &&
      sed -i 's/#LoadModule ssl_module/LoadModule ssl_module/' conf/httpd.conf &&
      sed -i 's/#LoadModule socache_shmcb_module/LoadModule socache_shmcb_module/' conf/httpd.conf &&
      echo 'Include conf/extra/proxy.conf' >> conf/httpd.conf &&
      httpd-foreground"
    # Quitamos los ports para evitar el error "address already in use"
    # El tráfico entrará por el túnel de Cloudflare de forma segura
    volumes:
      - ./proxy_config/proxy.conf:/usr/local/apache2/conf/extra/proxy.conf
      - ./certificados:/usr/local/apache2/conf/ssl
    networks:
      - red-peluqueria
    depends_on:
      - app

  # 2. CLOUDFLARE TUNNEL - Conecta nuestra red interna con tu dominio oficial
  cloudflare_tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=eyJhIjoiYjQ5OTQ0MzFiYWVkZjVmZmYxMjg0NGNmMzI0MjQ4MzciLCJ0IjoiNDA4OGEzMmItMjIyNy00NTM4LTk2ZjAtMjQyZjUzZjhhY2M1IiwicyI6Ik0yVmpOamN5TVRndE1qWTJNUzAwWmpBekxUazJNV1F0TlRJd1lUYzJOalZoWWpndyJ9
    command: tunnel run
    networks:
      - red-peluqueria

  # 3. WEB PHP
  app:
    build: .
    container_name: php_app
    restart: always
    volumes:
      - .:/var/www/html
    networks:
      - red-peluqueria
    depends_on:
      - db

  # 4. BASE DE DATOS
  db:
    image: mysql:5.7
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reservaya
      MYSQL_USER: reserva_user
      MYSQL_PASSWORD: Usuario_123
    volumes:
      - ./datos_sql:/var/lib/mysql
    networks:
      - red-peluqueria

networks:
  red-peluqueria:
    driver: bridge
